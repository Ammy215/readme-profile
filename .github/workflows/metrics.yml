name: Update GitHub metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  metrics-dark:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ammy215
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          config_timezone: UTC
          config_theme: dark
          filename: assets/github-metrics-dark.svg
          committer_message: "chore: update dark GitHub metrics card [skip ci]"

  metrics-light:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ammy215
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          config_timezone: UTC
          config_theme: classic
          filename: assets/github-metrics-light.svg
          committer_message: "chore: update light GitHub metrics card [skip ci]"
