<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" height="190" role="img" aria-labelledby="termTitle termDesc">
<title id="termTitle">Terminal boot sequence</title>
<desc id="termDesc">A mock terminal window typing: whoami, then "ammar — cybersecurity by networking by AI", then a status check, then "building, breaking, automating", ending on a blinking cursor.</desc>
<defs>
<clipPath id="lineClip0"><rect class="reveal" style="animation-delay:0.2s" x="0" y="44" width="604" height="28"/></clipPath><clipPath id="lineClip1"><rect class="reveal" style="animation-delay:1.1s" x="0" y="74" width="604" height="28"/></clipPath><clipPath id="lineClip2"><rect class="reveal" style="animation-delay:2.2s" x="0" y="104" width="604" height="28"/></clipPath><clipPath id="lineClip3"><rect class="reveal" style="animation-delay:3.1s" x="0" y="134" width="604" height="28"/></clipPath>
</defs>
<style>
  .reveal { animation: typeReveal 0.6s steps(24, end) forwards; }
  @keyframes typeReveal { from { width: 0; } to { width: 604px; } }
  .cursor { animation: blink 1s steps(2, jump-none) infinite; animation-fill-mode: both; opacity: 0; }
  @keyframes blink {
    0% { opacity: 0; }
    1% { opacity: 1; }
    50% { opacity: 1; }
    51% { opacity: 0; }
    100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; width: 604px; }
    .cursor { animation: none; opacity: 1; }
  }
</style>
<rect x="0" y="0" width="640" height="190" rx="0" fill="#070a12"/><rect x="1" y="1" width="638" height="188" rx="10" fill="#0b0f1a" stroke="#1c2436" stroke-width="1.5"/><path d="M1,11 a10,10 0 0 1 10,-10 h618 a10,10 0 0 1 10,10 v19 h-638 z" fill="#1c2436" opacity="0.35"/><circle cx="24" cy="15.0" r="5" fill="#ffb454" opacity="0.9"/><circle cx="42" cy="15.0" r="5" fill="#38bdf8" opacity="0.9"/><circle cx="60" cy="15.0" r="5" fill="#3ddc84" opacity="0.9"/><text x="320.0" y="20.0" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#5b6478">ammar@security:~</text>
<g clip-path="url(#lineClip0)"><text x="18" y="66" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#3ddc84" xml:space="preserve">$ <tspan fill="#c9d4e8">whoami</tspan></text></g><g clip-path="url(#lineClip1)"><text x="18" y="96" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#5b6478" xml:space="preserve">> <tspan fill="#3ddc84">ammar — cybersecurity × networking × AI</tspan></text></g><g clip-path="url(#lineClip2)"><text x="18" y="126" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#3ddc84" xml:space="preserve">$ <tspan fill="#c9d4e8">status --live</tspan></text></g><g clip-path="url(#lineClip3)"><text x="18" y="156" font-family="'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#5b6478" xml:space="preserve">> <tspan fill="#38bdf8">building · breaking · automating</tspan></text></g>
<rect class="cursor" style="animation-delay:4.0s" x="385" y="140" width="9" height="20" fill="#3ddc84"/>
</svg>
