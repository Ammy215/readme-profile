<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="avatarTitle avatarDesc">
<title id="avatarTitle">Pixel-art security workstation</title>
<desc id="avatarDesc">Retro 16-bit style illustration of a desk at night lit by the glow of three monitors: a green terminal/log stream on the center screen, a blue network topology graph on the left screen, and an amber dashboard with bar charts and a gauge on the right screen. A mug and keyboard sit on the desk.</desc>
<defs>
<filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="10"/>
</filter>
<style>
  .cursor { animation: blink 1.1s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .glowpulse { animation: pulse 3.6s ease-in-out infinite; transform-origin: center; }
  .g2 { animation-delay: .6s; }
  .g3 { animation-delay: 1.2s; }
  @keyframes pulse { 0%, 100% { opacity: var(--base-op); } 50% { opacity: calc(var(--base-op) * 1.6); } }
  @media (prefers-reduced-motion: reduce) {
    .cursor, .glowpulse { animation: none; }
  }
</style>
</defs>
