  .glowpulse { animation: pulse 3.6s ease-in-out infinite; }
  .g2 { animation-delay: .5s; }
  .g3 { animation-delay: 1s; }
  @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
